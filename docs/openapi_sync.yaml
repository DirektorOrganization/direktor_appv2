  /sync/inbox:
    post:
      summary: Recibe la cola local del movil
      operationId: postSyncInbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncInboxRequest'
            examples:
              default:
                value:
                  userId: 7
                  source: direktor_appv2
                  items:
                    - queueId: 101
                      entityType: restriction
                      entityId: "405"
                      operationType: update
                      payload: "{\"codAnaResActividad\":405,\"codEstadoActividad\":\"completed\"}"
                    - queueId: 102
                      entityType: agreement
                      entityId: "601"
                      operationType: update
                      payload: "{\"codActReuAcuerdos\":601,\"codEstado\":\"completed\"}"
      responses:
        '200':
          description: Cola aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncInboxResponse'
              examples:
                default:
                  value:
                    success: true
                    accepted: 2
                    processedAt: "2026-03-09T11:00:00-05:00"
                    results:
                      - queueId: 101
                        status: accepted
                      - queueId: 102
                        status: accepted
        '400':
          description: Request invalido
  /sync/pull:
    post:
      summary: Devuelve datos remotos para actualizar SQLite
      operationId: postSyncPull
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPullRequest'
            examples:
