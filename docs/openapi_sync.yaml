components:
  schemas:
    AuthLoginRequest:
      type: object
      required: [userOrEmail, password, keepSignedIn, source]
      properties:
        userOrEmail:
          type: string
        password:
          type: string
        keepSignedIn:
          type: boolean
        source:
          type: string
    AuthLoginResponse:
      type: object
      required: [success, token, refreshToken, user, projects]
      properties:
        success:
          type: boolean
        token:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/AuthUserPayload'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectPayload'
    SyncInboxRequest:
      type: object
      required: [userId, source, items]
      properties:
        userId:
          type: integer
        source:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncInboxItem'
    SyncInboxItem:
      type: object
      required: [queueId, entityType, entityId, operationType, payload]
      properties:
        queueId:
          type: integer
        entityType:
          type: string
          enum: [restriction, agreement]
        entityId:
          type: string
        operationType:
          type: string
          enum: [create, update, status_update]
        payload:
          type: string
    SyncInboxResponse:
      type: object
      required: [success, accepted, processedAt, results]
      properties:
        success:
          type: boolean
        accepted:
          type: integer
        processedAt:
          type: string
          format: date-time
        results:
          type: array
          items:
            type: object
            required: [queueId, status]
            properties:
              queueId:
                type: integer
              status:
                type: string
    SyncPullRequest:
      type: object
      required: [userId, source, scope, businessDate]
      properties:
        userId:
          type: integer
        source:
          type: string
        scope:
          type: string
          enum: [full, operational]
        businessDate:
          type: string
          format: date
        since:
          type: string
          nullable: true
          format: date-time
    SyncPullResponse:
      type: object
      required: [success, scope, serverTime, businessDate, version]
      properties:
        success:
          type: boolean
        scope:
          type: string
          enum: [full, operational]
        serverTime:
          type: string
          format: date-time
        businessDate:
          type: string
          format: date
        version:
          type: string
        catalogs:
          $ref: '#/components/schemas/CatalogsPayload'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectPayload'
        restrictions:
          type: array
          items:
            $ref: '#/components/schemas/RestrictionPayload'
        meetings:
          type: array
          items:
            $ref: '#/components/schemas/MeetingPayload'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantPayload'
        agreements:
          type: array
          items:
            $ref: '#/components/schemas/AgreementPayload'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentPayload'
    CatalogsPayload:
      type: object
      properties:
        areas:
          type: array
          items:
            $ref: '#/components/schemas/AreaPayload'
        analysisAreas:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisAreaPayload'
        fronts:
          type: array
          items:
            $ref: '#/components/schemas/FrontPayload'
        phases:
          type: array
          items:
            $ref: '#/components/schemas/PhasePayload'
        types:
          type: array
          items:
            $ref: '#/components/schemas/TypePayload'
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/StatusPayload'
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberPayload'
    BaseSyncRow:
      type: object
      required: [updated_at, deleted]
      properties:
        updated_at:
          type: string
          format: date-time
        deleted:
          type: boolean
    AuthUserPayload:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        lastname:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        celular:
          type: string
          nullable: true
        nombreempresa:
          type: string
          nullable: true
        codCargo:
          type: integer
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    ProjectPayload:
      allOf:
        - $ref: '#/components/schemas/BaseSyncRow'
        - type: object
          required: [codProyecto]
          properties:
            codProyecto: { type: integer }
            desNombreProyecto: { type: string, nullable: true }
            codEstado: { type: integer, nullable: true }
            codEmpresa: { type: integer, nullable: true }
            desEmpresa: { type: string, nullable: true }
            codTipoProyecto: { type: integer, nullable: true }
            desTipoProyecto: { type: string, nullable: true }
            codMoneda: { type: integer, nullable: true }
            desMoneda: { type: string, nullable: true }
            desSimboloMoneda: { type: string, nullable: true }
            codUbigeo: { type: integer, nullable: true }
            desUbigeo: { type: string, nullable: true }
            desDireccion: { type: string, nullable: true }
            dayFechaInicio: { type: string, nullable: true }
            is_last_selected: { type: integer, nullable: true }
    AreaPayload:
      allOf:
        - $ref: '#/components/schemas/BaseSyncRow'
        - type: object
          required: [codArea]
          properties:
            codArea: { type: integer }
            desArea: { type: string, nullable: true }
            cod_Empresa: { type: integer, nullable: true }
    AnalysisAreaPayload:
      allOf:
        - $ref: '#/components/schemas/BaseSyncRow'
        - type: object
          required: [codAnaresArea]
          properties:
            codAnaresArea: { type: integer }
            codProyecto: { type: integer, nullable: true }
            codArea: { type: integer, nullable: true }
            desArea: { type: string, nullable: true }
            bgColor: { type: string, nullable: true }
    FrontPayload:
      allOf:
        - $ref: '#/components/schemas/BaseSyncRow'
        - type: object
          required: [codAnaResFrente]
          properties:
            codAnaResFrente: { type: integer }
            codProyecto: { type: integer, nullable: true }
            codAnaRes: { type: integer, nullable: true }
            desAnaResFrente: { type: string, nullable: true }
    PhasePayload:
      allOf:
        - $ref: '#/components/schemas/BaseSyncRow'
        - type: object
          required: [codAnaResFase]
          properties:
            codAnaResFase: { type: integer }
            codAnaResFrente: { type: integer, nullable: true }
            codProyecto: { type: integer, nullable: true }
            codAnaRes: { type: integer, nullable: true }
            desAnaResFase: { type: string, nullable: true }
            bgColor: { type: string, nullable: true }
    TypePayload:
      allOf:
